name: Deploy API

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build API Image
        run: |
          docker build \
          -f backend/Dockerfile.api \
          -t 977099003207.dkr.ecr.ap-south-1.amazonaws.com/video-platform/api:latest \
          ./backend

      - name: Push API Image
        run: |
          docker push 977099003207.dkr.ecr.ap-south-1.amazonaws.com/video-platform/api:latest

      - name: Redeploy ECS API
        run: |
          aws ecs update-service \
          --cluster video-platform \
          --service api-service \
          --force-new-deployment
